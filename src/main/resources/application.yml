# notification-service 기본 설정. 실제 값은 환경 변수나 Kubernetes Secret으로 넣는다.
# 프로필은 dev·prod 두 개. SPRING_PROFILES_ACTIVE로 고른다.
server:
  port: 8080

app:
  queue:
    # 알림 쪽지(NOTIFICATION)를 받는 표준 큐. DLQ는 인프라가 붙인다. 접두사 QUEUE_PREFIX는 필수 (dev만 application-dev.yml에서 보충)
    notifications: ${QUEUE_PREFIX}notification-events
  stream:
    # CloudFront origin 응답 타임아웃(30초)·ALB 유휴 타임아웃(60초)보다 짧아야 연결이 끊기지 않는다
    heartbeat-ms: ${SSE_HEARTBEAT_MS:20000}
    # 이 시간이 지나면 서버가 연결을 닫고, 화면(EventSource)이 Last-Event-ID로 다시 붙는다
    timeout-ms: ${SSE_TIMEOUT_MS:1800000}
    # 다시 붙을 때 Last-Event-ID 뒤의 알림을 이만큼까지 보낸다
    replay-limit: 50

spring:
  application:
    name: notification-service
  datasource:
    # dev·prod 모두 RDS. 주소는 환경 변수 DB_URL로 넣는다
    # IntelliJ에서 TestNotificationServiceApplication으로 실행하면 Docker MySQL이 대신 붙는다 (DB_URL 불필요)
    url: ${DB_URL:}
    username: ${DB_USERNAME:notification_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false           # SSE 연결이 DB 연결을 붙잡지 않게 한다
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        timezone:
          default_storage: NORMALIZE   # OffsetDateTime을 jdbc.time_zone(KST) 벽시계로 저장
  jackson:
    time-zone: Asia/Seoul         # 시각은 ISO-8601 +09:00
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
      sqs:
        queue-not-found-strategy: fail   # 큐가 없으면 만들지 않고 실패한다 (큐는 인프라가 만든다)
        observation-enabled: true        # 추적(할 일 16): 쪽지 속성 traceparent로 inventory의 traceId를 잇는다

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness, /readiness
  # 추적(할 일 16). 클러스터에서는 gitops 차트(spring-service)가 환경 변수로 켜고 주소를 넣는다. PC에는 Zipkin이 없어서 보내지 않는다.
  tracing:
    sampling:
      probability: 1.0            # MVP는 요청이 적어 전부 기록
    export:
      zipkin:
        enabled: false
